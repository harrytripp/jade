## CI rewrites the image: line on every deploy to main, so don't edit that line by hand.
services:
  app:
    image: ghcr.io/harrytripp/jade:sha-4eb262f
    pull_policy: always
    container_name: jade

    volumes:
      - jade_store:/app/store # PostgreSQL database; survives redeploys

    # Default bridge network. Uses JADE_HTTP_PORT if set in your
    # environment (or .env file), otherwise defaults to 7161.
    # Bind to "127.0.0.1:7161" to restrict access to localhost only.
    # Since it lacks authentication, publish it externally only if
    # your firewall or network restricts access to trusted clients.
    ports:
      - "${JADE_HTTP_PORT:-7161}:7161"

    # Hardening. The process runs as an unprivileged user (see Dockerfile)
    # and needs no Linux capabilities. read_only isn't set because Compose
    # can't inject a `content:` config into a read-only container.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped
    # On SIGTERM the app finishes any write in progress, closes the database
    # and exits. That takes a few seconds at most, well inside this limit.
    stop_grace_period: 60s

volumes:
  jade_store: