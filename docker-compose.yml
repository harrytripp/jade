## CI rewrites the image: line on every deploy to main, so don't edit that line by hand.
services:
  db:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example
      TZ: Europe/London
    volumes:
      - postgres_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  grafana:
    image: grafana/grafana
    container_name: grafana
    depends_on: [db]
    restart: unless-stopped
    environment:
      - GF_PLUGINS_PREINSTALL=grafana-postgresql-datasource
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/postgres.yml
    ports:
      - '3000:3000'

  app:
    image: ghcr.io/harrytripp/jade:sha-9b6e3cf
    pull_policy: always
    container_name: jade
    depends_on: [db]
    volumes:
      - postgres_data:/app/store
    # Default bridge network. Uses JADE_HTTP_PORT if set in your
    # environment (or .env file), otherwise defaults to 8090.
    ports:
      - "${JADE_HTTP_PORT:-8090}:8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

configs:
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Jade
          type: postgres
          uid: jade-pg
          url: db:5432
          user: grafana_ro
          secureJsonData:
            password: "${GRAFANA_DB_PASSWORD}"
          jsonData:
            database: jade
            sslmode: disable
          isDefault: true
          editable: false

volumes:
  postgres_data: